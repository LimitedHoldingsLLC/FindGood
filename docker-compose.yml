# Local infrastructure only. The API, worker, and Next.js app run on the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: findgood
      POSTGRES_PASSWORD: findgood
      POSTGRES_DB: findgood
    ports:
      - "5432:5432"
    volumes:
      - findgood_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findgood -d findgood"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  findgood_pg:
